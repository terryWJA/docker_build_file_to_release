name: Build Docker Image And Upload To Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: node-20.20.2-playwright

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "archive_name=${IMAGE_NAME}_${{ github.event.inputs.version }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile_20.20.2_playwerght \
            -t $IMAGE_NAME:${{ steps.vars.outputs.version }} \
            .

      - name: Save Docker image
        run: |
          docker save $IMAGE_NAME:${{ steps.vars.outputs.version }} | gzip > ${{ steps.vars.outputs.archive_name }}

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: Release ${{ steps.vars.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.vars.outputs.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
